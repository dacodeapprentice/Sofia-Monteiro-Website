<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="canonical" href="free-templates.html" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph & Social Card Previews -->
    <meta property="og:title" data-i18n-meta="freetemplates.og_title" content="Free Templates — Sofia" />
    <meta property="og:description" data-i18n-meta="freetemplates.og_desc" content="Free downloadable graphic mockups and templates for shirts, objects, books, and editorial layouts by Sofia." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="free-templates.html" />
    <meta property="og:image" content="https://iili.io/naGx4yb.jpg" />

    <meta property="og:image:alt" content="Free Templates — Sofia" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" data-i18n-meta="freetemplates.og_title" content="Free Templates — Sofia" />
    <meta name="twitter:description" data-i18n-meta="freetemplates.og_desc" content="Free downloadable graphic mockups and templates for shirts, objects, books, and editorial layouts by Sofia." />
    <meta name="twitter:image" content="https://iili.io/naGx4yb.jpg" />
    <meta name="theme-color" content="#080d12" />

    <!-- Google Fonts: Lora for reading text (serif), Plus Jakarta Sans for titles (non-serif) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Anti-Flash Early Language Setter -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('sofia_portfolio_lang');
          var lang = (saved === 'pt' || saved === 'en') ? saved : ((navigator.language || navigator.userLanguage || '').toLowerCase().startsWith('pt') ? 'pt' : 'en');
          document.documentElement.lang = lang === 'pt' ? 'pt-PT' : 'en';
          document.documentElement.setAttribute('data-lang', lang);
        } catch(e) {}
      })();
    </script>

    <!-- Shared Tailwind CSS Stylesheet -->
    <link rel="stylesheet" href="/shared/style.css" />
  </head>
  <body class="bg-[#080d12] text-slate-200 antialiased selection:bg-teal-500/30 selection:text-teal-200 min-h-screen flex flex-col justify-between relative">

    <!-- Unified Header Mount -->
    <header id="site-header" class="sticky top-0 z-30 w-full bg-[#080d12]/90 backdrop-blur-md border-b border-teal-950/70 transition-colors"></header>

    <!-- Unified Slide-out Drawer Mount -->
    <div id="site-drawer"></div>

    <!-- Main Content Container: Free Templates -->
    <main class="flex-1 w-full max-w-5xl mx-auto py-16 md:py-24 px-4 sm:px-6 lg:px-8">
      <!-- Page Header -->
      <div class="mb-10">
        <div class="flex items-center gap-2 text-xs text-teal-400 font-sans tracking-wide uppercase mb-2.5">
          <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM14 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-4zM14 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z" />
          </svg>
          <span data-i18n="freetemplates.section_tag">Digital Projects · Image Editing / Free Templates</span>
        </div>
        <h1 class="font-title text-4xl sm:text-5xl font-extrabold tracking-tight text-white mb-3" data-i18n="freetemplates.title">
          Free Templates
        </h1>
        <p class="font-serif text-slate-300 text-lg sm:text-xl leading-relaxed max-w-2xl" data-i18n="freetemplates.subtitle">
          Free editable graphic mockups and design templates organized for shirts, objects, books, and visual layouts.
        </p>
      </div>

      <!-- Template Type Filter Controls -->
      <section id="templates-directory" class="space-y-6">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-2 border-b border-teal-950/60">
          <!-- Category Filter Tabs -->
          <div class="flex flex-wrap items-center gap-2" role="tablist" aria-label="Template category filters">
            <button
              type="button"
              role="tab"
              data-template-filter="all"
              aria-selected="true"
              class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-title font-medium transition-all duration-200 cursor-pointer bg-teal-950/80 text-teal-300 border border-teal-800/60 shadow-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-teal-400"
            >
              <span data-i18n="freetemplates.filter_all">All Templates</span>
            </button>
            <button
              type="button"
              role="tab"
              data-template-filter="shirts"
              aria-selected="false"
              class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-title font-medium transition-all duration-200 cursor-pointer bg-[#0c141d] text-slate-400 hover:text-white hover:bg-[#121e2a] border border-teal-900/30 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-teal-400"
            >
              <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 4l4 3-2 4-2-1v10H8V10l-2 1-2-4 4-3a4 4 0 008 0z" />
              </svg>
              <span data-i18n="freetemplates.filter_shirts">Shirts</span>
            </button>
            <button
              type="button"
              role="tab"
              data-template-filter="objects"
              aria-selected="false"
              class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-title font-medium transition-all duration-200 cursor-pointer bg-[#0c141d] text-slate-400 hover:text-white hover:bg-[#121e2a] border border-teal-900/30 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-teal-400"
            >
              <svg class="w-3.5 h-3.5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
              </svg>
              <span data-i18n="freetemplates.filter_objects">Objects</span>
            </button>
            <button
              type="button"
              role="tab"
              data-template-filter="books"
              aria-selected="false"
              class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-title font-medium transition-all duration-200 cursor-pointer bg-[#0c141d] text-slate-400 hover:text-white hover:bg-[#121e2a] border border-teal-900/30 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-teal-400"
            >
              <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
              </svg>
              <span data-i18n="freetemplates.filter_books">Books</span>
            </button>
          </div>

          <!-- Active Filter Status -->
          <div class="text-xs font-mono text-slate-400 flex items-center gap-2">
            <span data-i18n="freetemplates.active_label">Category:</span>
            <span id="active-template-filter-label" class="text-teal-300 font-semibold" data-i18n="freetemplates.filter_all">All Templates</span>
          </div>
        </div>

        <!-- Under Construction Notice -->
        <div class="space-y-8">
          <div class="rounded-2xl bg-[#0c1520] border border-teal-900/30 p-6 sm:p-10 md:p-12 shadow-xl" data-under-construction></div>
        </div>
      </section>
    </main>

    <!-- Unified Footer Mount -->
    <footer id="site-footer" class="w-full bg-[#05080c] border-t border-teal-950/80 py-12 md:py-16 px-4 sm:px-6 lg:px-8 text-slate-400 mt-auto"></footer>

    <!-- Unified i18n, Images & Layout Scripts -->
    <script type="module" src="/shared/i18n.js"></script>
    <script type="module" src="/shared/images.js"></script>
    <script type="module" src="/shared/layout.js"></script>

    <!-- Template Filter Interaction Controller -->
    <script type="module">
      (function () {
        const filterBtns = document.querySelectorAll('[data-template-filter]');
        const activeLabel = document.getElementById('active-template-filter-label');
        let currentFilter = 'all';

        const filterKeyMap = {
          all: 'freetemplates.filter_all',
          shirts: 'freetemplates.filter_shirts',
          objects: 'freetemplates.filter_objects',
          books: 'freetemplates.filter_books'
        };

        const activeBtnClass = 'inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-title font-medium transition-all duration-200 cursor-pointer bg-teal-950/80 text-teal-300 border border-teal-800/60 shadow-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-teal-400';
        const inactiveBtnClass = 'inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-title font-medium transition-all duration-200 cursor-pointer bg-[#0c141d] text-slate-400 hover:text-white hover:bg-[#121e2a] border border-teal-900/30 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-teal-400';

        function updateActiveLabel() {
          if (!activeLabel) return;
          const key = filterKeyMap[currentFilter] || filterKeyMap.all;
          activeLabel.setAttribute('data-i18n', key);
          if (window.i18n && typeof window.i18n.t === 'function') {
            activeLabel.textContent = window.i18n.t(key);
          } else {
            const activeBtn = document.querySelector(`[data-template-filter="${currentFilter}"] span`);
            if (activeBtn) activeLabel.textContent = activeBtn.textContent;
          }
        }

        filterBtns.forEach((btn) => {
          btn.addEventListener('click', () => {
            currentFilter = btn.getAttribute('data-template-filter') || 'all';
            filterBtns.forEach((b) => {
              const isSelected = b === btn;
              b.setAttribute('aria-selected', isSelected ? 'true' : 'false');
              b.className = isSelected ? activeBtnClass : inactiveBtnClass;
            });
            updateActiveLabel();
          });
        });

        window.addEventListener('languagechange', updateActiveLabel);
      })();
    </script>
  </body>
</html>
