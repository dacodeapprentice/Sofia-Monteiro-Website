    <!-- Anti-Flash Early Language Setter -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('sofia_portfolio_lang');
          var lang = (saved === 'pt' || saved === 'en') ? saved : ((navigator.language || navigator.userLanguage || '').toLowerCase().startsWith('pt') ? 'pt' : 'en');
          document.documentElement.lang = lang;
          document.documentElement.setAttribute('data-lang', lang);
        } catch (e) {}
      })();
    </script>

    <!-- Shared Tailwind CSS Stylesheet -->
    <link rel="stylesheet" href="/shared/style.css" />
